{# "Tell your stylist": a note the user gives the stylist directly, sent with every request. The
   notes aren't listed (the user found the list clutter); htmx swaps this form after saving. #}
<form class="panel stylist-notes" id="notes" method="post" action="/stylist/notes" hx-post="/stylist/notes"
      hx-target="#notes" hx-swap="outerHTML" hx-disabled-elt="find button">
  <label for="note-text">Tell your stylist something to remember</label>
  <div class="note-add">
    <input type="text" id="note-text" name="text" maxlength="300" required
           placeholder="e.g. I never wear shorts">
    <button class="primary" type="submit">Remember</button>
  </div>
  {% if saved %}<p class="muted small" role="status">Saved. Your stylist will remember that.</p>{% endif %}
</form>
