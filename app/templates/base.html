<!doctype html>
{% from "_icons.html" import icon %}
{% set p = prefs() %}
<html lang="en" data-theme="{{ p.theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{ 'light dark' if p.theme == 'system' else p.theme }}">
  <title>{% block title %}FORME{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">FORME</a>
    <nav>
      <a href="/closet">Closet</a>
      <a href="/outfits">Outfits</a>
      <a href="/studio" class="wide-only">Studio</a>
      <a href="/settings" class="icon-link" title="Settings">{{ icon("settings", label="Settings") }}</a>
      <a class="button primary" href="/add">+ Add<span class="wide-only"> item</span></a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Back from the next page (back/forward cache): un-stick a "Take photo" button left at
    // "Uploading…" and re-enable the file fields it disabled (see _camera.html).
    addEventListener("pageshow", function (e) {
      if (!e.persisted) return;
      document.querySelectorAll(".camera.busy").forEach(function (b) {
        b.classList.remove("busy");
        b.querySelector(".camera-label").textContent = b.dataset.label;
        b.querySelector("input").value = "";
        b.querySelector("input").form.querySelectorAll("input[type=file]").forEach(function (i) { i.disabled = false; });
      });
    });
  </script>
</body>
</html>
