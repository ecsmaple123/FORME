<!doctype html>
{% from "_icons.html" import icon %}
{% set p = prefs() %}
<html lang="en" data-theme="{{ p.theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{ 'light dark' if p.theme == 'system' else p.theme }}">
  <title>{% block title %}FORME{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">FORME</a>
    <nav>
      <a href="/browse">Browse</a>
      <a href="/categories">Categories</a>
      <a href="/settings" class="icon-link" title="Settings">{{ icon("settings", label="Settings") }}</a>
      <a class="button primary" href="/add">+ Add<span class="wide-only"> item</span></a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
