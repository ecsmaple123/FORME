{% extends "base.html" %}
{% block title %}Closet · FORME{% endblock %}
{% block content %}
<h1 class="page-title">Closet</h1>
<form id="filters" class="filters" method="get" action="/closet"
      hx-get="/closet" hx-target="#grid" hx-push-url="true"
      hx-trigger="input changed delay:300ms from:#q, search from:#q, change">
  <div class="chips" role="radiogroup" aria-label="Category">
    <label class="chip"><input type="radio" name="category" value=""
      {% if not category_id %}checked{% endif %}><span>All</span></label>
    {% for c in categories %}
    <label class="chip"><input type="radio" name="category" value="{{ c.id }}"
      {% if category_id == c.id %}checked{% endif %}><span>{{ c.name }}
      <small>{{ counts.get(c.id, 0) }}</small></span></label>
    {% endfor %}
  </div>
  <div class="searchrow">
    <input id="q" type="search" name="q" value="{{ q }}" placeholder="Search name, fabric, brand or tag"
           autocomplete="off">
    <select name="sort" aria-label="Sort within each category">
      {% for key, label in SORTS.items() %}
      <option value="{{ key }}" {% if sort == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <noscript><button type="submit">Filter</button></noscript>
  </div>
</form>
{% if request.query_params.get("deleted") %}<p class="flash">Item deleted.</p>{% endif %}
<div id="grid">{% include "_grid.html" %}</div>
{% endblock %}
